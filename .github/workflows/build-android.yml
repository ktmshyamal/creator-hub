name: Build Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files
        working-directory: mobile
        run: |
          npm install
          node prepare.js
      - name: Create Android project
        working-directory: mobile
        run: |
          npx cap add android
          npx cap sync android
      - name: Use the Creator Hub icon
        working-directory: mobile
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in $RES/mipmap-*; do
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do cp ../icons/icon-192.png $d/$n.png; done
          done
      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Creator-Hub-Android-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
